<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天天酷跑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="天天酷跑">
<meta name="theme-color" content="#120a24">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a1838; --gold: #ffd24a; --pink: #ff6fc0; --panel: rgba(32, 16, 64, .72); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #120a24; overflow: hidden; touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 1280px; height: 720px; transform-origin: 0 0; position: absolute; left: 0; top: 0; overflow: hidden; touch-action: none; }
  #game { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
  .hidden { display: none !important; }
  .fun { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; }

  /* ---------- 大厅 ---------- */
  #lobby { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,8,48,.25), rgba(20,8,48,.7)); }
  .logo { position: absolute; left: 40px; top: 18px; font-size: 64px; letter-spacing: 4px; line-height: 1;
    background: linear-gradient(180deg, #fff6a8, #ffb02e 55%, #ff6a2a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 0 var(--ink)) drop-shadow(0 0 2px var(--ink)); transform: rotate(-3deg); }
  .logo small { display: block; font-size: 18px; letter-spacing: 6px; color: #fff; -webkit-text-fill-color: #fff; margin-top: 6px; filter: none; text-shadow: 0 2px 0 var(--ink); }
  .topbar { position: absolute; right: 36px; top: 26px; display: flex; gap: 12px; align-items: center; }
  .chip { background: var(--panel); border: 2px solid rgba(255,255,255,.25); border-radius: 22px; padding: 8px 18px; font-size: 20px; display: flex; gap: 8px; align-items: center; }
  .chip b { color: var(--gold); }
  .iconbtn { width: 46px; height: 46px; border-radius: 50%; background: var(--panel); border: 2px solid rgba(255,255,255,.25); font-size: 22px; }

  .preview { position: absolute; left: 36px; top: 120px; width: 500px; height: 560px; border-radius: 28px; background: var(--panel);
    border: 3px solid rgba(255,255,255,.18); overflow: hidden; box-shadow: 0 10px 0 rgba(0,0,0,.25); }
  #pv { position: absolute; left: 0; top: 0; width: 500px; height: 380px; }
  .info { position: absolute; left: 20px; right: 20px; top: 372px; }
  .info h2 { margin: 0; font-size: 34px; display: flex; align-items: baseline; gap: 12px; text-shadow: 0 3px 0 var(--ink); }
  .info h2 span { font-size: 18px; color: #d8c8ff; font-family: "PingFang SC", sans-serif; text-shadow: none; }
  .skillbox { margin-top: 10px; background: rgba(0,0,0,.25); border-radius: 16px; padding: 10px 14px; font-size: 15px; line-height: 1.55; }
  .skillbox .t { color: var(--gold); font-weight: 800; }
  .skillbox .m { color: #9fe6ff; font-weight: 800; }

  .right { position: absolute; left: 560px; right: 36px; top: 100px; }
  .sec { margin-bottom: 6px; }
  .sec h3 { margin: 0 0 6px 4px; font-size: 20px; text-shadow: 0 2px 0 var(--ink); font-weight: normal; }
  .row { display: flex; gap: 12px; }
  .card { flex: 1; position: relative; background: var(--panel); border: 3px solid rgba(255,255,255,.15); border-radius: 20px; padding: 6px 6px 8px; text-align: center;
    transition: transform .12s, border-color .12s, background .12s; }
  .card:hover { transform: translateY(-3px); }
  .card.sel { border-color: var(--gold); background: linear-gradient(180deg, rgba(255,210,74,.32), rgba(32,16,64,.8)); box-shadow: 0 0 18px rgba(255,210,74,.45); }
  .card canvas { display: block; margin: 0 auto; }
  .card .n { font-size: 17px; font-weight: 800; }
  .card .s { font-size: 12px; color: #d8c8ff; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mode { padding: 8px 8px; }
  .mode .ic { font-size: 26px; line-height: 1.1; }
  .mode .n { font-size: 20px; }
  .mode .best { font-size: 13px; color: var(--gold); margin-top: 4px; }
  #startBtn { position: absolute; right: 36px; bottom: 26px; width: 280px; height: 84px; border-radius: 42px; font-size: 40px; letter-spacing: 6px;
    background: linear-gradient(180deg, #ffe14d, #ff8a1f); color: #fff; text-shadow: 0 3px 0 #b84a00, 0 0 2px #b84a00;
    border: 4px solid var(--ink); box-shadow: 0 8px 0 var(--ink), inset 0 4px 0 rgba(255,255,255,.5); animation: pulse 1.4s infinite; }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 2px 0 var(--ink); }
  @keyframes pulse { 50% { filter: brightness(1.12); transform: scale(1.03); } }
  .keys { position: absolute; left: 560px; width: 380px; bottom: 26px; font-size: 13px; color: #d8c8ff; line-height: 1.7; }
  .keys kbd { background: rgba(255,255,255,.15); border-radius: 6px; padding: 1px 7px; border: 1px solid rgba(255,255,255,.3); font-family: inherit; }

  /* ---------- 游戏 HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud button { pointer-events: auto; }
  #btnPause { position: absolute; right: 30px; top: 24px; width: 64px; height: 64px; border-radius: 50%; background: var(--panel); border: 3px solid rgba(255,255,255,.3); font-size: 26px; }
  #btnSkill { position: absolute; right: 40px; bottom: 36px; width: 128px; height: 128px; border-radius: 50%; padding: 0; background: none; }
  #btnSkill .ring { position: absolute; inset: 0; border-radius: 50%; }
  #btnSkill .core { position: absolute; inset: 10px; border-radius: 50%; border: 4px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 22px; line-height: 1.15; text-shadow: 0 2px 0 var(--ink); }
  #btnSkill .core small { font-size: 13px; font-family: "PingFang SC", sans-serif; opacity: .9; }
  #btnSkill.ready .core { animation: pulse .8s infinite; }
  #btnSkill.ready::after { content: "E"; position: absolute; top: -6px; left: -6px; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--ink); font-weight: 900; line-height: 34px; font-size: 18px; border: 3px solid var(--ink); }
  .tbtn { position: absolute; bottom: 36px; width: 150px; height: 110px; border-radius: 30px; background: rgba(32,16,64,.35); border: 3px dashed rgba(255,255,255,.35); font-size: 26px; display: none; }
  .touch .tbtn { display: block; }
  #tSlide { left: 36px; }
  #tJump { right: 190px; }

  /* ---------- 弹窗 ---------- */
  .modal { position: absolute; inset: 0; background: rgba(12,6,30,.6); display: flex; align-items: center; justify-content: center; }
  .box { width: 560px; background: linear-gradient(180deg, #4a2a9a, #2a1660); border: 4px solid var(--ink); border-radius: 32px; padding: 26px 34px 30px; text-align: center;
    box-shadow: 0 12px 0 rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.2); }
  .box h1 { margin: 0 0 12px; font-size: 52px; color: var(--gold); text-shadow: 0 4px 0 var(--ink); font-weight: normal; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 18px; }
  .stat { background: rgba(0,0,0,.25); border-radius: 16px; padding: 10px; }
  .stat .k { font-size: 14px; color: #d8c8ff; }
  .stat .v { font-size: 30px; }
  .stat.big { grid-column: span 2; }
  .stat.big .v { font-size: 52px; color: var(--gold); }
  .newrec { display: inline-block; background: #ff4a6a; border-radius: 12px; padding: 2px 12px; font-size: 18px; margin-left: 8px; vertical-align: middle; animation: pulse .8s infinite; }
  .btns { display: flex; gap: 14px; justify-content: center; }
  .btn { min-width: 150px; height: 60px; border-radius: 30px; font-size: 24px; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); background: linear-gradient(180deg, #8fe9ff, #36a8ff); text-shadow: 0 2px 0 var(--ink); }
  .btn.primary { background: linear-gradient(180deg, #ffe14d, #ff8a1f); }
  .btn.gray { background: linear-gradient(180deg, #c8c0e0, #7a70a0); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  #rotate { position: fixed; inset: 0; background: #120a24; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; font-size: 22px; padding: 30px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>

    <div id="lobby">
      <div class="logo fun">天天酷跑<small>RUN · JUMP · FLY</small></div>
      <div class="topbar">
        <div class="chip fun">🪙 <b id="totalCoins">0</b></div>
        <button class="iconbtn" id="btnMute" title="声音">🔊</button>
      </div>
      <div class="preview">
        <canvas id="pv"></canvas>
        <div class="info">
          <h2 class="fun" id="cName">疾风·阿飞 <span>影之忍者</span></h2>
          <div class="skillbox" id="cSkill"></div>
        </div>
      </div>
      <div class="right">
        <div class="sec"><h3 class="fun">选择角色</h3><div class="row" id="charRow"></div></div>
        <div class="sec"><h3 class="fun">选择坐骑</h3><div class="row" id="mountRow"></div></div>
        <div class="sec"><h3 class="fun">选择模式</h3><div class="row" id="modeRow"></div></div>
      </div>
      <div class="keys">
        <kbd>空格</kbd>/<kbd>↑</kbd> 跳跃（空中再按二段跳） &nbsp; <kbd>↓</kbd>/<kbd>S</kbd> 下滑（空中按下急降）<br>
        <kbd>E</kbd> 释放技能（收集金币充能） &nbsp; <kbd>P</kbd>/<kbd>Esc</kbd> 暂停 &nbsp; 手机：左侧下滑 · 右侧跳跃
      </div>
      <button id="startBtn" class="fun">开始奔跑</button>
    </div>

    <div id="hud" class="hidden">
      <button id="btnPause">❚❚</button>
      <button class="tbtn fun" id="tSlide">下滑</button>
      <button class="tbtn fun" id="tJump">跳跃</button>
      <button id="btnSkill"><div class="ring"></div><div class="core fun"><span id="skName">技能</span><small id="skPct">0%</small></div></button>
    </div>

    <div id="pauseM" class="modal hidden">
      <div class="box">
        <h1 class="fun">暂停中</h1>
        <div class="btns">
          <button class="btn primary fun" id="bResume">继续</button>
          <button class="btn fun" id="bRestart">重新开始</button>
          <button class="btn gray fun" id="bHome">返回大厅</button>
        </div>
      </div>
    </div>

    <div id="resultM" class="modal hidden">
      <div class="box">
        <h1 class="fun" id="rTitle">游戏结束</h1>
        <div class="stats">
          <div class="stat big"><div class="k">本局得分</div><div class="v fun" id="rScore">0</div></div>
          <div class="stat"><div class="k">奔跑距离</div><div class="v fun" id="rDist">0</div></div>
          <div class="stat"><div class="k">收集金币</div><div class="v fun" id="rCoins">0</div></div>
          <div class="stat"><div class="k">摧毁障碍</div><div class="v fun" id="rSmash">0</div></div>
          <div class="stat"><div class="k">历史最佳</div><div class="v fun" id="rBest">0</div></div>
        </div>
        <div class="btns">
          <button class="btn primary fun" id="bAgain">再来一局</button>
          <button class="btn gray fun" id="bHome2">返回大厅</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="rotate" class="fun">请将手机横屏游玩 📱↻</div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
