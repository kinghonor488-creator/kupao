<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>天天酷跑</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="天天酷跑">
<meta name="theme-color" content="#120a24">
<link rel="apple-touch-icon" href="icon.png?v=20261026a">
<link rel="manifest" href="manifest.webmanifest?v=20261026a">
<link rel="icon" href="icon.png?v=20261026a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2a1838; --gold: #ffd24a; --dia: #7fe8ff; --panel: rgba(32, 16, 64, .78); --panel2: rgba(255,255,255,.08); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: #120a24; overflow: hidden; touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #fff; }
  #stage { width: 1280px; height: 720px; /* 宽度由 ui.js 按 KP.W 设置 */ transform-origin: 0 0; position: absolute; left: 0; top: 0; overflow: hidden; touch-action: none; }
  #game { position: absolute; left: 0; top: 0; width: 100%; height: 720px; display: block; }
  .hidden { display: none !important; }
  .fun { font-family: "ZCOOL KuaiLe", "PingFang SC", sans-serif; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; background: none; padding: 0; }
  .ts { text-shadow: 0 2px 0 var(--ink), 0 0 2px var(--ink); }

  /* ---------- 顶栏 ---------- */
  .topbar { position: absolute; left: 0; right: 0; top: 0; height: 76px; display: flex; align-items: center; gap: 12px; padding: 0 24px;
    background: linear-gradient(180deg, rgba(20,8,48,.85), rgba(20,8,48,0)); }
  .logo { font-size: 40px; line-height: 1; background: linear-gradient(180deg, #fff6a8, #ffb02e 55%, #ff6a2a); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 1px var(--ink)); transform: rotate(-3deg); margin-right: auto; }
  .chip { height: 42px; background: var(--panel); border: 2px solid rgba(255,255,255,.25); border-radius: 21px; padding: 0 16px 0 6px; font-size: 20px; display: flex; gap: 8px; align-items: center; min-width: 130px; }
  .chip .ic { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; }
  .chip.coin .ic { background: radial-gradient(circle at 35% 30%, #fff6b0, #ffc61a 60%, #d68a00); }
  .chip.dia .ic { background: radial-gradient(circle at 35% 30%, #e8fdff, #5fe0ff 60%, #2a8fff); }
  .chip b { color: var(--gold); font-weight: normal; }
  .chip.dia b { color: var(--dia); }
  .iconbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--panel); border: 2px solid rgba(255,255,255,.25); font-size: 20px; }

  /* ---------- 大厅 ---------- */
  #hall { position: absolute; inset: 0; }
  .side { position: absolute; top: 96px; display: flex; flex-direction: column; gap: 14px; }
  .side.l { left: 24px; } .side.r { right: 24px; align-items: flex-end; }
  .mbtn { position: relative; width: 96px; height: 96px; border-radius: 26px; background: linear-gradient(180deg, rgba(110,70,220,.9), rgba(52,26,120,.92));
    border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink), inset 0 3px 0 rgba(255,255,255,.25); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; transition: transform .1s; }
  .mbtn:hover { transform: translateY(-2px); }
  .mbtn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
  .mbtn .e { font-size: 38px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0,0,0,.3)); }
  .mbtn .t { font-size: 18px; }
  .dot::after { content: ""; position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: #ff3b5c; border: 3px solid var(--ink); }
  .gacha-btn { width: 200px; height: 128px; border-radius: 28px; background: linear-gradient(160deg, #ff7ac8, #a056ff 55%, #4a2ad8); }
  .gacha-btn .e { font-size: 54px; animation: bob 1.6s ease-in-out infinite; }
  .gacha-btn .t { font-size: 24px; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(-6deg); } }

  .infobar { position: absolute; left: 150px; right: 430px; bottom: 22px; height: 116px; display: flex; gap: 10px; }
  .ibox { flex: 1; background: var(--panel); border: 2px solid rgba(255,255,255,.18); border-radius: 18px; padding: 8px 12px; font-size: 13px; line-height: 1.5; color: #e4d8ff; overflow: hidden; cursor: pointer; }
  .ibox h4 { margin: 0 0 2px; font-size: 16px; color: #fff; font-weight: normal; display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
  .ibox .hl { color: var(--gold); }
  .tslots { display: flex; gap: 6px; margin-top: 4px; }
  .tslot { width: 40px; height: 40px; border-radius: 10px; background: rgba(0,0,0,.3); border: 2px dashed rgba(255,255,255,.3); display: grid; place-items: center; font-size: 22px; position: relative; }
  .tslot.on { border-style: solid; border-color: var(--gold); }
  .tslot small { position: absolute; right: -2px; bottom: -4px; font-size: 10px; background: var(--ink); border-radius: 6px; padding: 0 3px; }
  .rar { display: inline-block; padding: 0 7px; border-radius: 8px; font-size: 12px; line-height: 18px; font-family: Arial, sans-serif; font-weight: 900; color: #fff; border: 2px solid var(--ink); }
  .rar.N { background: #8a96b0; } .rar.R { background: #3a9cf0; } .rar.SR { background: #b05cf0; } .rar.SSR { background: linear-gradient(90deg, #ffb02e, #ff5a6a); }

  .startbox { position: absolute; right: 24px; bottom: 22px; width: 390px; }
  .modes { display: flex; gap: 6px; margin-bottom: 10px; }
  .mode { flex: 1; height: 62px; border-radius: 16px; background: var(--panel); border: 3px solid rgba(255,255,255,.15); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px; line-height: 1.2; }
  .mode .i { font-size: 22px; }
  .mode.sel { border-color: var(--gold); background: linear-gradient(180deg, rgba(255,210,74,.35), rgba(32,16,64,.85)); }
  .modeinfo { font-size: 13px; color: #d8c8ff; margin: -2px 4px 8px; display: flex; justify-content: space-between; }
  #startBtn { width: 100%; height: 76px; border-radius: 38px; font-size: 38px; letter-spacing: 6px; background: linear-gradient(180deg, #ffe14d, #ff8a1f); color: #fff;
    text-shadow: 0 3px 0 #b84a00, 0 0 2px #b84a00; border: 4px solid var(--ink); box-shadow: 0 7px 0 var(--ink), inset 0 4px 0 rgba(255,255,255,.5); animation: pulse 1.4s infinite; }
  #startBtn:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--ink); }
  @keyframes pulse { 50% { filter: brightness(1.12); transform: scale(1.03); } }

  /* ---------- 面板 ---------- */
  .panel { position: absolute; inset: 0; background: radial-gradient(ellipse at 30% 0%, #4a2aa0, #1a0c3a 70%); }
  .panel .topbar { background: rgba(0,0,0,.25); }
  .back { height: 44px; padding: 0 18px 0 12px; border-radius: 22px; background: var(--panel); border: 2px solid rgba(255,255,255,.25); font-size: 20px; }
  .ptitle { font-size: 34px; margin-right: auto; }
  .pbody { position: absolute; left: 24px; right: 24px; top: 88px; bottom: 20px; display: flex; gap: 18px; }
  .gridwrap { flex: 1; overflow-y: auto; touch-action: pan-y; padding: 6px 6px 20px; border-radius: 20px; background: rgba(0,0,0,.18); }
  .gridwrap::-webkit-scrollbar { width: 8px; } .gridwrap::-webkit-scrollbar-thumb { background: rgba(255,255,255,.25); border-radius: 4px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .card { position: relative; border-radius: 16px; padding: 4px 4px 6px; text-align: center; background: var(--panel2); border: 3px solid rgba(255,255,255,.12); transition: transform .1s; }
  .card:hover { transform: translateY(-2px); }
  .card.sel { border-color: #fff; box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(255,210,74,.6); }
  .card canvas { display: block; margin: 0 auto; border-radius: 12px; }
  .card .n { font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .rar { position: absolute; left: 6px; top: 6px; }
  .card.lock canvas, .card.lock .ticon { filter: grayscale(.55) brightness(.78); }
  .card .tag { position: absolute; right: 6px; top: 6px; font-size: 11px; padding: 0 6px; border-radius: 8px; background: #2ac46a; border: 2px solid var(--ink); line-height: 16px; }
  .card .price { font-size: 12px; color: var(--gold); }
  .card .price.d { color: var(--dia); }
  .card .lv { position: absolute; right: 6px; bottom: 30px; font-size: 12px; background: var(--ink); border-radius: 8px; padding: 0 6px; color: var(--gold); }
  .card.N { background: linear-gradient(180deg, rgba(154,166,192,.25), rgba(255,255,255,.05)); }
  .card.R { background: linear-gradient(180deg, rgba(74,184,255,.3), rgba(255,255,255,.05)); }
  .card.SR { background: linear-gradient(180deg, rgba(196,107,255,.35), rgba(255,255,255,.05)); }
  .card.SSR { background: linear-gradient(180deg, rgba(255,176,46,.45), rgba(255,90,106,.12)); }

  .detail { width: 430px; flex: none; border-radius: 22px; background: var(--panel); border: 3px solid rgba(255,255,255,.15); display: flex; flex-direction: column; overflow: hidden; }
  #pv { width: 430px; height: 250px; display: block; flex: none; }
  .dinfo { padding: 6px 18px 14px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .dinfo h2 { margin: 0; font-size: 30px; font-weight: normal; display: flex; align-items: center; gap: 10px; }
  .dinfo .sub { color: #d8c8ff; font-size: 14px; margin-bottom: 6px; }
  .stats { display: flex; gap: 8px; margin: 4px 0 8px; }
  .stat { flex: 1; background: rgba(0,0,0,.25); border-radius: 12px; padding: 4px 8px; text-align: center; font-size: 12px; color: #d8c8ff; }
  .stat b { display: block; font-size: 20px; color: #fff; font-weight: normal; }
  .desc { font-size: 14px; line-height: 1.6; background: rgba(0,0,0,.2); border-radius: 12px; padding: 8px 12px; flex: 1; overflow: auto; }
  .desc .k { color: var(--gold); }
  .acts { display: flex; gap: 10px; margin-top: 10px; }
  .btn { flex: 1; height: 56px; border-radius: 28px; font-size: 22px; border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); background: linear-gradient(180deg, #8fe9ff, #36a8ff); text-shadow: 0 2px 0 var(--ink); }
  .btn.primary { background: linear-gradient(180deg, #ffe14d, #ff8a1f); }
  .btn.purple { background: linear-gradient(180deg, #e0a0ff, #9a4af0); }
  .btn.gray { background: linear-gradient(180deg, #c8c0e0, #7a70a0); }
  .btn:disabled { filter: grayscale(1) brightness(.75); cursor: default; }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  .trow { display: flex; gap: 12px; align-items: center; margin-bottom: 10px; padding: 10px 14px; background: rgba(0,0,0,.25); border-radius: 18px; font-size: 15px; color: #d8c8ff; }
  .trow .tslot { width: 64px; height: 64px; font-size: 36px; border-radius: 16px; cursor: pointer; }
  .trow .tslot small { font-size: 12px; }
  .ticon { width: 100%; height: 86px; display: grid; place-items: center; font-size: 52px; border-radius: 12px; background: rgba(0,0,0,.2); }

  /* ---------- 抽奖 ---------- */
  .gbody { position: absolute; left: 24px; right: 24px; top: 88px; bottom: 20px; display: flex; gap: 20px; }
  #gcv { width: 720px; height: 612px; border-radius: 24px; background: rgba(0,0,0,.2); flex: none; }
  .gside { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .gbtn { height: 96px; border-radius: 26px; font-size: 28px; border: 4px solid var(--ink); box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; text-shadow: 0 2px 0 var(--ink); }
  .gbtn small { font-size: 16px; color: #fff; opacity: .95; }
  .gbtn:disabled { filter: grayscale(1) brightness(.7); }
  .gbtn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
  .rates { background: rgba(0,0,0,.25); border-radius: 18px; padding: 12px 16px; font-size: 14px; line-height: 1.8; color: #d8c8ff; }

  .modal { position: absolute; inset: 0; background: rgba(12,6,30,.72); display: flex; align-items: center; justify-content: center; }
  .box { min-width: 520px; max-width: 1100px; background: linear-gradient(180deg, #4a2a9a, #2a1660); border: 4px solid var(--ink); border-radius: 32px; padding: 22px 30px 26px; text-align: center;
    box-shadow: 0 12px 0 rgba(0,0,0,.35), inset 0 3px 0 rgba(255,255,255,.2); }
  .box h1 { margin: 0 0 12px; font-size: 46px; color: var(--gold); font-weight: normal; }
  .rgrid { display: grid; grid-template-columns: repeat(5, 170px); gap: 12px; justify-content: center; margin-bottom: 18px; perspective: 800px; }
  .rgrid.one { grid-template-columns: 220px; }
  .rcard { border-radius: 18px; padding: 6px; border: 3px solid var(--ink); opacity: 0; transform: rotateY(90deg) scale(.6); transition: transform .35s cubic-bezier(.2,1.6,.4,1), opacity .2s; position: relative; }
  .rcard.show { opacity: 1; transform: none; }
  .rcard canvas { display: block; margin: 0 auto; }
  .rcard .n { font-size: 15px; font-weight: 800; }
  .rcard .s { font-size: 12px; color: #fff; opacity: .9; }
  .rcard .rar { position: absolute; left: 6px; top: 6px; }
  .rcard.new::after { content: "NEW"; position: absolute; right: 6px; top: 6px; background: #ff3b5c; border: 2px solid var(--ink); border-radius: 8px; font-size: 11px; padding: 0 5px; font-weight: 900; }
  .rcard.N { background: linear-gradient(180deg, #8a96b0, #4a5470); }
  .rcard.R { background: linear-gradient(180deg, #4ab8ff, #2a5ab0); }
  .rcard.SR { background: linear-gradient(180deg, #c46bff, #5a2ab0); box-shadow: 0 0 22px rgba(196,107,255,.8); }
  .rcard.SSR { background: linear-gradient(180deg, #ffd24a, #ff5a6a); box-shadow: 0 0 30px rgba(255,200,60,.95); }
  .signrow { display: flex; gap: 10px; margin: 6px 0 18px; }
  .sday { width: 108px; height: 130px; border-radius: 18px; background: rgba(0,0,0,.25); border: 3px solid rgba(255,255,255,.15); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; position: relative; }
  .sday .e { font-size: 36px; } .sday .a { font-size: 18px; }
  .sday.got { opacity: .45; } .sday.got::after { content: "✔"; position: absolute; font-size: 54px; color: #5ee07a; text-shadow: 0 3px 0 var(--ink); }
  .sday.today { border-color: var(--gold); box-shadow: 0 0 16px rgba(255,210,74,.6); }
  .statsr { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 8px 0 18px; }
  .sr { background: rgba(0,0,0,.25); border-radius: 16px; padding: 8px; }
  .sr .k { font-size: 13px; color: #d8c8ff; } .sr .v { font-size: 28px; }
  .sr.big { grid-column: span 3; } .sr.big .v { font-size: 52px; color: var(--gold); }
  .newrec { display: inline-block; background: #ff4a6a; border-radius: 12px; padding: 2px 12px; font-size: 18px; margin-left: 8px; vertical-align: middle; animation: pulse .8s infinite; }
  .btns { display: flex; gap: 14px; justify-content: center; }
  .btns .btn { flex: none; min-width: 170px; }
  #toast { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); background: rgba(20,8,48,.92); border: 3px solid var(--gold); border-radius: 22px; padding: 8px 22px; font-size: 20px; pointer-events: none; transition: opacity .3s; opacity: 0; z-index: 5; white-space: nowrap; }
  #toast.on { opacity: 1; }

  /* ---------- 游戏 HUD ---------- */
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #hud button { pointer-events: auto; }
  #btnPause { position: absolute; right: 30px; top: 24px; width: 64px; height: 64px; border-radius: 50%; background: var(--panel); border: 3px solid rgba(255,255,255,.3); font-size: 26px; }
  #btnSkill { position: absolute; right: 40px; bottom: 36px; width: 128px; height: 128px; border-radius: 50%; }
  #btnSkill .ring { position: absolute; inset: 0; border-radius: 50%; }
  #btnSkill .core { position: absolute; inset: 10px; border-radius: 50%; border: 4px solid var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; line-height: 1.15; text-shadow: 0 2px 0 var(--ink); }
  #btnSkill .core small { font-size: 13px; font-family: "PingFang SC", sans-serif; opacity: .9; }
  #btnSkill.ready .core { animation: pulse .8s infinite; }
  #btnSkill.ready::after { content: "E"; position: absolute; top: -6px; left: -6px; width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--ink); font-weight: 900; line-height: 34px; font-size: 18px; border: 3px solid var(--ink); }
  .tbtn { position: absolute; bottom: 36px; width: 150px; height: 110px; border-radius: 30px; background: rgba(32,16,64,.35); border: 3px dashed rgba(255,255,255,.35); font-size: 26px; display: none; }
  .touch .tbtn { display: block; }
  #tSlide { left: 36px; } #tJump { right: 190px; }
  #rotate { position: fixed; inset: 0; background: #120a24; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; font-size: 22px; padding: 30px; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- 大厅 -->
  <div id="hall">
    <div class="topbar">
      <div class="logo fun">天天酷跑</div>
      <div class="chip coin fun"><span class="ic">🪙</span><b class="vCoin">0</b></div>
      <div class="chip dia fun"><span class="ic">💎</span><b class="vDia">0</b></div>
      <button class="iconbtn" id="btnMute">🔊</button>
    </div>
    <div class="side l">
      <button class="mbtn fun ts" data-open="chars"><span class="e">🦸</span><span class="t">角色</span></button>
      <button class="mbtn fun ts" data-open="mounts"><span class="e">🦄</span><span class="t">坐骑</span></button>
      <button class="mbtn fun ts" data-open="pets"><span class="e">🐝</span><span class="t">宠物</span></button>
      <button class="mbtn fun ts" data-open="treasures"><span class="e">🏺</span><span class="t">宝物</span></button>
    </div>
    <div class="side r">
      <button class="mbtn gacha-btn fun ts" id="openGacha"><span class="e">🎁</span><span class="t">幸运抽奖</span></button>
      <button class="mbtn fun ts" id="openSign"><span class="e">📅</span><span class="t">签到</span></button>
    </div>
    <div class="infobar">
      <div class="ibox" data-open="chars" id="iChar"></div>
      <div class="ibox" data-open="mounts" id="iMount"></div>
      <div class="ibox" data-open="pets" id="iPet"></div>
      <div class="ibox" data-open="treasures" id="iTre"></div>
    </div>
    <div class="startbox">
      <div class="modes" id="modes"></div>
      <div class="modeinfo"><span id="mDesc"></span><span id="mBest"></span></div>
      <button id="startBtn" class="fun">开始奔跑</button>
    </div>
  </div>

  <!-- 角色 / 坐骑 / 宠物 / 宝物 面板 -->
  <div id="panel" class="panel hidden">
    <div class="topbar">
      <button class="back fun" data-close>← 返回</button>
      <div class="ptitle fun ts" id="pTitle">角色</div>
      <div class="chip coin fun"><span class="ic">🪙</span><b class="vCoin">0</b></div>
      <div class="chip dia fun"><span class="ic">💎</span><b class="vDia">0</b></div>
    </div>
    <div class="pbody">
      <div class="gridwrap"><div class="trow hidden" id="tRow"></div><div class="grid" id="grid"></div></div>
      <div class="detail">
        <canvas id="pv"></canvas>
        <div class="dinfo">
          <h2 class="fun ts" id="dName"></h2>
          <div class="sub" id="dSub"></div>
          <div class="stats" id="dStats"></div>
          <div class="desc" id="dDesc"></div>
          <div class="acts" id="dActs"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 抽奖 -->
  <div id="gacha" class="panel hidden">
    <div class="topbar">
      <button class="back fun" data-close>← 返回</button>
      <div class="ptitle fun ts">幸运抽奖</div>
      <div class="chip coin fun"><span class="ic">🪙</span><b class="vCoin">0</b></div>
      <div class="chip dia fun"><span class="ic">💎</span><b class="vDia">0</b></div>
    </div>
    <div class="gbody">
      <canvas id="gcv"></canvas>
      <div class="gside">
        <button class="gbtn fun" id="gFree" style="background:linear-gradient(180deg,#9ff07a,#3ac04a)">每日免费一抽<small id="gFreeT">今日可用</small></button>
        <button class="gbtn fun" id="g1" style="background:linear-gradient(180deg,#8fe9ff,#36a8ff)">单抽<small>💎 100</small></button>
        <button class="gbtn fun" id="g10" style="background:linear-gradient(180deg,#ffe14d,#ff8a1f)">十连抽<small>💎 900 · 必出 SR 以上</small></button>
        <div class="rates" id="gRates"></div>
      </div>
    </div>
  </div>

  <!-- 弹窗：抽奖结果 / 签到 / 结算 / 暂停 -->
  <div id="drawM" class="modal hidden"><div class="box"><h1 class="fun">恭喜获得</h1><div class="rgrid" id="rGrid"></div><div class="btns"><button class="btn primary fun" id="drawOk">确定</button></div></div></div>
  <div id="signM" class="modal hidden"><div class="box"><h1 class="fun">每日签到</h1><div class="signrow" id="signRow"></div><div class="btns"><button class="btn primary fun" id="signBtn">签到领取</button><button class="btn gray fun" id="signClose">关闭</button></div></div></div>
  <div id="pauseM" class="modal hidden"><div class="box"><h1 class="fun">暂停中</h1><div class="btns">
    <button class="btn primary fun" id="bResume">继续</button><button class="btn fun" id="bRestart">重新开始</button><button class="btn gray fun" id="bHome">返回大厅</button></div></div></div>
  <div id="resultM" class="modal hidden"><div class="box">
    <h1 class="fun" id="rTitle">游戏结束</h1>
    <div class="statsr">
      <div class="sr big"><div class="k">本局得分</div><div class="v fun" id="rScore">0</div></div>
      <div class="sr"><div class="k">奔跑距离</div><div class="v fun" id="rDist">0</div></div>
      <div class="sr"><div class="k">获得金币（含加成）</div><div class="v fun" id="rCoins" style="color:var(--gold)">0</div></div>
      <div class="sr"><div class="k">获得钻石</div><div class="v fun" id="rDia" style="color:var(--dia)">0</div></div>
      <div class="sr"><div class="k">摧毁障碍</div><div class="v fun" id="rSmash">0</div></div>
      <div class="sr"><div class="k">历史最佳</div><div class="v fun" id="rBest">0</div></div>
      <div class="sr"><div class="k">模式</div><div class="v fun" id="rMode">经典</div></div>
    </div>
    <div class="btns"><button class="btn primary fun" id="bAgain">再来一局</button><button class="btn gray fun" id="bHome2">返回大厅</button></div>
  </div></div>

  <!-- 游戏 HUD -->
  <div id="hud" class="hidden">
    <button id="btnPause">❚❚</button>
    <button class="tbtn fun" id="tSlide">下滑</button>
    <button class="tbtn fun" id="tJump">跳跃</button>
    <button id="btnSkill"><div class="ring"></div><div class="core fun"><span id="skName">技能</span><small id="skPct">0%</small></div></button>
  </div>
  <div id="toast" class="fun"></div>
</div>
<div id="rotate" class="fun">请将手机横屏游玩 📱↻</div>
